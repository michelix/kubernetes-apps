name: Terminal Backend Smoke Tests

on:
  push:
    branches:
      - main
    paths:
      - 'applications/terminal/backend/**'
      - '.github/workflows/backend-smoke-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'applications/terminal/backend/**'
      - '.github/workflows/backend-smoke-tests.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Run Backend Smoke Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: applications/terminal/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile main.py database.py

      - name: API smoke checks
        env:
          DATABASE_URL: sqlite:///./smoke.db
          ENABLE_DOCS: "false"
          SHOW_DETAILED_ERRORS: "false"
          CORS_ALLOW_ORIGINS: "https://terminal.example.com"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app

          client = TestClient(app)

          r = client.get('/health')
          assert r.status_code == 200, r.text
          assert r.json().get('status') == 'healthy'

          r = client.get('/api')
          assert r.status_code == 200, r.text
          assert 'version' in r.json(), r.text

          r = client.post('/api/execute', json={'command': 'whoami'})
          assert r.status_code == 200, r.text
          body = r.json()
          assert 'output' in body, body

          print('Backend smoke checks passed')
          PY
